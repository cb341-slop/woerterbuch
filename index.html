<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wörterbuch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231b1b1b'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='monospace' font-size='42' fill='white'%3EW%3C/text%3E%3C/svg%3E">
  <style>
    :root { height: 100%; color-scheme: light dark; font-family: ui-monospace, monospace; }
    * { box-sizing: border-box; }
    body { width: 100%; max-width: 100rem; height: 100%; height: 100dvh; margin: 0 auto; padding: 1rem; overflow: hidden; background: Canvas; color: CanvasText; }
    main { height: 100%; min-height: 0; display: flex; flex-direction: column; }
    h1, h2, h3 { margin: 0 0 .75rem; }
    section, details { margin: 0 0 1rem; }
    article, details, .directory { border: 1px solid GrayText; padding: .75rem; }
    label { display: block; margin-bottom: .25rem; }
    input, select, button { font: inherit; border-radius: 0; }
    input[type="search"] { width: 100%; padding: .45rem; }
    button, select { padding: .4rem .6rem; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
    output { display: block; min-height: 1.5rem; margin-top: .5rem; }
    output[data-kind="error"] { color: #b00020; }
    output[data-kind="ok"] { color: #18752c; }
    .layout { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(18rem, 24rem) minmax(0, 1fr); gap: 1rem; align-items: stretch; }
    .directory { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .layout > div { min-height: 0; overflow: auto; padding-right: .25rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
    .grow { flex: 1 1 22rem; }
    .word-scroll { min-height: 0; flex: 1; overflow: auto; border: 1px solid GrayText; }
    .word-list { margin: .5rem 0; padding-left: 2rem; }
    .word-list li { margin-bottom: .15rem; }
    #list-status { color: GrayText; }
    [hidden] { display: none !important; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .25rem .4rem; border: 1px solid GrayText; text-align: left; vertical-align: top; }
    th { width: 13rem; }
    p, li, td { overflow-wrap: anywhere; }
    .entry-text { white-space: pre-wrap; line-height: 1.45; }
    .headword + .headword { border-top: 1px solid GrayText; padding-top: .75rem; }
    ul { padding-left: 1.4rem; }
    a { color: LinkText; text-decoration: underline; }
    small { color: GrayText; }
    @media (max-width: 52rem) {
      .layout { grid-template-columns: 1fr; grid-template-rows: minmax(14rem, 40%) minmax(0, 1fr); }
    }
    @media (prefers-color-scheme: dark) {
      output[data-kind="error"] { color: #ff8a8a; }
      output[data-kind="ok"] { color: #7bd88f; }
    }
  </style>
  <script src="word_index/web-index.js" defer></script>
  <script src="dictionary-index.js" defer></script>
  <script src="dictionary.js" defer></script>
  <script src="word-list.js" defer></script>
</head>
<body>
  <main>
    <h1>Wörterbuch</h1>
    <div class="layout">
      <aside class="directory" aria-labelledby="directory-title">
        <h2 id="directory-title">Words</h2>
        <label for="word-filter">Filter all words</label>
        <input id="word-filter" type="search" autocomplete="off" placeholder="Type to filter" autofocus>
        <output id="list-status" aria-live="polite">Loading words…</output>
        <div class="word-scroll" tabindex="0">
          <nav aria-label="All indexed words">
            <ul id="word-list" class="word-list"></ul>
          </nav>
        </div>
      </aside>

      <div aria-live="polite">
        <output id="status">Select a word from the list.</output>
        <section id="results" hidden aria-labelledby="result-title">
          <div class="controls">
            <div class="grow">
              <h2 id="result-title">Result</h2>
              <small id="result-summary"></small>
            </div>
            <div id="match-control" hidden>
              <label for="match">Match</label>
              <select id="match"></select>
            </div>
          </div>
          <article id="record"></article>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
